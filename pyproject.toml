[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "english-learning-api"
version = "0.1.0"
description = "FastAPI service for the English Learning App"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "bcrypt>=4.1,<5.0",
  "email-validator>=2.1,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "PyJWT>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "pydantic-settings>=2.3,<3.0"
  ,"python-multipart>=0.0.9,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
